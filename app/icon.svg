<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer border ring: yellow, then black, then white -->
  <circle cx="50" cy="50" r="49" fill="#FBBC05"/>
  <circle cx="50" cy="50" r="46" fill="#000000"/>
  <circle cx="50" cy="50" r="44" fill="#FFFFFF"/>
  <!-- Yin-yang body (inside the white border), radius 42 -->
  <!-- Left half black -->
  <path d="M50 8 A42 42 0 0 0 50 92 Z" fill="#000000"/>
  <!-- Right half yellow -->
  <path d="M50 8 A42 42 0 0 1 50 92 Z" fill="#FBBC05"/>
  <!-- S-curve: top lobe black, bottom lobe yellow -->
  <path d="M50 8 A21 21 0 0 1 50 50 A21 21 0 0 0 50 92 A42 42 0 0 1 50 8 Z" fill="#000000"/>
  <!-- Top small dot: white on black lobe -->
  <circle cx="50" cy="29" r="7" fill="#FFFFFF"/>
  <!-- Bottom small dot: black on yellow lobe -->
  <circle cx="50" cy="71" r="7" fill="#000000"/>
</svg>
