<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer border ring: yellow, then black, then white -->
  <circle cx="50" cy="50" r="49" fill="#FBBC05"/>
  <circle cx="50" cy="50" r="46" fill="#000000"/>
  <circle cx="50" cy="50" r="44" fill="#FFFFFF"/>
  <!-- Yin-yang body inside the white border, radius 42, center (50,50) -->
  <!-- Yellow base disc -->
  <circle cx="50" cy="50" r="42" fill="#FBBC05"/>
  <!-- Black half: left side via outer half-circle (top->bottom on the left),
       then the S-curve back up: small half-circle bulging right (top lobe),
       then small half-circle carving left (bottom lobe). -->
  <path d="M50 8
           A42 42 0 0 0 50 92
           A21 21 0 0 0 50 50
           A21 21 0 0 1 50 8
           Z" fill="#000000"/>
  <!-- Top dot: white, on the black top lobe -->
  <circle cx="50" cy="29" r="7" fill="#FFFFFF"/>
  <!-- Bottom dot: black, on the yellow bottom lobe -->
  <circle cx="50" cy="71" r="7" fill="#000000"/>
</svg>
